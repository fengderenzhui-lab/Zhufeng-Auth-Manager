# 逐风授权码管理平台 - Nginx（TLS 1.2/1.3 only + HSTS）
# 证书挂载：宿主机 ./certs/ 目录 -> 容器 /etc/nginx/certs/（只读）
# 证书文件约定：tls.crt / tls.key（可用 certbot/自签，生产环境建议权威证书）

# CSP 按 URI 区分（等保 M-04 修复：页面级已去除 unsafe-inline，
# 防 FOUC 脚本抽为独立外链 theme-init.js，双端统一 script-src 'self'）：
#  - /api*（JSON 接口）：严格 default-src 'none'（无脚本/无样式/无外部加载）
#  - 其它（Blade 页面）  ：'self'（资源全部来自同源，无 CDN 依赖）
map $uri $zf_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'";
    ~^/api "default-src 'none'; base-uri 'none'; frame-ancestors 'none'";
}

# HTTP -> HTTPS 强制跳转
server {
    listen 80;
    server_name _;

    # 生产环境必须开启；如前端 LB 已终止 TLS 可注释掉本块
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    # 仅允许 TLS 1.2 / 1.3，禁用 TLS 1.0/1.1 与 SSLv3
    ssl_protocols TLSv1.2 TLSv1.3;

    # 现代强套件（禁用 RC4/3DES/DES/EXPORT/PSK/anon 等弱套件）
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 隐藏 nginx 版本号（等保-信息泄露）
    server_tokens off;

    # HSTS（等保/浏览器强制 HTTPS，max-age 31536000 即 1 年）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    root /var/www/html/public;
    index index.php;

    # 等保基础响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy $zf_csp always;

    charset utf-8;
    client_max_body_size 4M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # 等保 M-05：显式覆写 X-Forwarded-Proto，杜绝客户端伪造该头绕过 HTTPS 强制
        # （应用层 ForceHttps 仅在 trust_proxies=true 时读取该头，这里始终标记为本反代 TLS 状态）
        fastcgi_param X-Forwarded-Proto https;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|log|git|pem|key)$ {
        deny all;
    }

    # ZF-2026-008：品牌化 404 页（Laravel 渲染 resources/views/errors/404.blade.php）
    # 静态资源 404 也统一走应用 404 页，避免暴露 nginx 默认页与目录结构
    error_page 404 /index.php;
}
